modLoader = "javafml"
loaderVersion = "[10,11)"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Salt"
description = "${description}"

[[mixins]]
config = "salts_inventory_controlify.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.11.42,21.12)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "salts_inventory_update"
type = "required"
versionRange = "[${core_version}]"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "controlify"
type = "required"
versionRange = "[3.0.1,3.5.0)"
ordering = "AFTER"
side = "CLIENT"
