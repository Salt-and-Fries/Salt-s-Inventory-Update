import java.security.MessageDigest

// Focused Compatibility rebuild/packaging only; no unrelated gameplay or functional suite.
gradle.afterProject { configured, state ->
    if (configured != gradle.rootProject) return
    gradle.projectsEvaluated {
        def root = gradle.rootProject
        def targets = root.subprojects.findAll {
            it.path.startsWith(':compatibility:') && it.name in ['fabric', 'forge', 'neoforge']
        }
        def artifacts = targets.collect { project -> project.tasks.named(
            project.tasks.findByName('remapJar') != null ? 'remapJar' :
                project.tasks.findByName('reobfJar') != null ? 'reobfJar' : 'jar') }
        def stage = root.tasks.register('stageCompatibilityQaArtifacts') {
            dependsOn(artifacts)
            doLast {
                if (artifacts.size() != 12) throw new GradleException('Expected twelve Compatibility targets')
                def folder = root.file('dist/compatibility'); folder.mkdirs()
                def names = artifacts.collect { it.get().archiveFile.get().asFile.name }.toSet()
                folder.listFiles().findAll { it.name.endsWith('.jar') && !names.contains(it.name) }.each { it.delete() }
                artifacts.each { provider ->
                    def file = provider.get().archiveFile.get().asFile
                    if (!file.isFile() || file.name.contains('-dev') || file.name.contains('sources'))
                        throw new GradleException('Invalid production artifact: ' + file)
                    root.copy { from(file); into(folder) }
                }
                def jars = folder.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }
                if (jars.size() != 12) throw new GradleException('Unexpected Compatibility artifact count')
                new File(folder, 'SHA256SUMS.txt').text = jars.collect { file ->
                    MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() + '  ' + file.name
                }.join('\n') + '\n'
            }
        }
        root.tasks.named('bundleLatestMods').configure { setDependsOn([stage]) }
    }
}
