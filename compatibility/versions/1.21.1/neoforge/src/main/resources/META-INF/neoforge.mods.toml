modLoader = "javafml"
loaderVersion = "[4.0.34,5)"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://salt-and-fries.github.io/Salt-s-Inventory-Update/"
issueTrackerURL = "https://github.com/Salt-and-Fries/Salt-s-Inventory-Update/issues"
logoFile = "assets/salts_inventory_update/icon.png"
authors = "Salt"
description = "${description}"

[[mixins]]
config = "${mod_id}.sophisticated.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.229,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
